description: >-
  The Bureau of Justice Statistics (BJS) is the agency within the U.S. Department of Justice responsible for collecting,
  analysing, and disseminating crime, criminal-justice, expenditure, and victimisation data. BJS exposes selected
  datasets through Socrata Open Data APIs and offers interactive data analysis tools such as the Justice Expenditure and
  Employment Tool (JEET) and the National Crime Victimization Survey (NCVS) Quick Tables.
